{% extends "base.html" %}

{% block title %}Error {{ code }} - InterviewIQ AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm">
            <div class="card-body py-5">
                <h1 class="display-1 text-danger">{{ code }}</h1>
                <h3 class="mb-4">Oops! Something went wrong</h3>
                <p class="text-muted">{{ message or "An unexpected error occurred." }}</p>
                <div class="mt-4">
                    <a href="/" class="btn btn-primary">Go to Home</a>
                    {% if g.user %}
                        <a href="{{ url_for('interview.dashboard') }}" class="btn btn-secondary">Dashboard</a>
                    {% else %}
                        <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
